name: DAYFLOW Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;platforms;android-35;build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project and Gradle tasks
        shell: bash
        run: |
          set -euo pipefail
          echo "Gradle executable:"
          command -v gradle
          gradle --version
          echo "Project modules:"
          gradle --no-daemon projects
          echo "Checking Android assemble task exists:"
          gradle --no-daemon :app:tasks --all | grep -E 'assembleDebug'
          test -f app/build.gradle.kts
          grep -q 'com.android.application' app/build.gradle.kts

      - name: Build DAYFLOW debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload DAYFLOW APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
